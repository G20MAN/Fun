<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中秋快乐！团团圆圆</title>
    <style>
        /* 基础样式保持国潮风 */
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at 50% 30%, #1a103c 0%, #0b071e 70%, #05030a 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        h1 {
            color: #fff;
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
            background: linear-gradient(45deg, #ffd700, #ff8c00, #ff4500, #ffd700);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: flowText 4s ease infinite;
            z-index: 10;
            user-select: none;
        }

        .mooncake-container {
            width: 200px;
            height: 200px;
            position: relative;
            animation: float 4s ease-in-out infinite;
            cursor: pointer;
            z-index: 10;
        }

        .mooncake {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 40%, #ffb347, #d47a16 70%, #8a4500 100%);
            border-radius: 50%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 30px rgba(255,165,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.05s;
            border: 6px dashed #bd6408;
        }

        .mooncake:active {
            transform: scale(0.88);
        }

        .mooncake-pattern {
            width: 75%;
            height: 75%;
            border: 4px double #ffe4b5;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffe4b5;
            font-weight: bold;
            font-size: 1.8rem;
        }

        .tip {
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
            margin-top: 30px;
            letter-spacing: 2px;
        }

        /* 💡 核心优化：利用 CSS 硬件加速的爆炸文字/星星粒子 */
        .css-particle {
            position: absolute;
            pointer-events: none;
            z-index: 5;
            font-weight: bold;
            font-size: 16px;
            white-space: nowrap;
            /* 开启 GPU 硬件加速 */
            will-change: transform, opacity; 
            animation: cssExplode 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        /* 背景微弱升起的孔明灯 */
        .lantern {
            position: absolute;
            width: 14px;
            height: 20px;
            background: #ff5500;
            border-radius: 4px;
            box-shadow: 0 0 10px #ff5500;
            opacity: 0.4;
            bottom: -30px;
            animation: rise 12s linear infinite;
        }

        /* 极简动画库 */
        @keyframes flowText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        @keyframes rise {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            20% { opacity: 0.5; }
            100% { transform: translateY(-110vh) translateX(50px) scale(1.2); opacity: 0; }
        }
        
        /* 粒子散射+淡出单次完成 */
        @keyframes cssExplode {
            0% {
                transform: translate(0, 0) scale(0.5);
                opacity: 1;
            }
            100% {
                /* 使用 var 接收来自 JS 算出的随机方向，GPU 渲染极其丝滑 */
                transform: translate(var(--tx), var(--ty)) scale(1.1);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <h1>中秋快乐</h1>
    
    <div class="mooncake-container" onclick="explode(event)">
        <div class="mooncake">
            <div class="mooncake-pattern">中秋</div>
        </div>
    </div>

    <div class="tip">👉 狂点月饼触发中秋福气 👈</div>

    <script>
        const blessings = ["🥮", "🌕", "🎑", "✨", "中秋快乐", "团圆", "幸福", "阖家欢乐", "✨", "🏮"];
        
        // 动态生成少量背景灯笼
        for(let i=0; i<12; i++) {
            let lantern = document.createElement('div');
            lantern.className = 'lantern';
            lantern.style.left = Math.random() * 100 + 'vw';
            lantern.style.animationDelay = (Math.random() * 8) + 's';
            document.body.appendChild(lantern);
        }

        let lastClickTime = 0;

        function explode(e) {
            const now = Date.now();
            // 【优化点 1】高频节流：两次点击之间必须间隔 70 毫秒，防止手指连击过快导致网页瘫痪
            if (now - lastClickTime < 70) return;
            lastClickTime = now;

            const rect = e.currentTarget.getBoundingClientRect();
            const startX = rect.left + rect.width / 2;
            const startY = rect.top + rect.height / 2;
            
            // 【优化点 2】每次只需喷射 15 个高精粒子，视觉效果就已经很饱满
            for (let i = 0; i < 15; i++) {
                const p = document.createElement('div');
                p.className = 'css-particle';
                
                // 随机决定是文字还是星星
                p.innerText = blessings[Math.floor(Math.random() * blessings.length)];
                p.style.color = `hsla(${Math.random() * 50 + 30}, 100%, 65%, 1)`;
                
                // 确定起始出生点
                p.style.left = startX + 'px';
                p.style.top = startY + 'px';
                
                // 计算爆炸散射的终点轨迹
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 140 + 60; // 散射范围
                const tx = Math.cos(angle) * distance + 'px';
                const ty = (Math.sin(angle) * distance + 50) + 'px'; // 稍微带有一点下坠重力感
                
                p.style.setProperty('--tx', tx);
                p.style.setProperty('--ty', ty);
                
                document.body.appendChild(p);
                
                // 【优化点 3】动画结束后立即销毁节点，零内存残留
                setTimeout(() => p.remove(), 800);
            }
        }
    </script>
</body>
</html>
