<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中秋快乐！团团圆圆</title>
    <style>
        /* 抖音国潮风夜空背景 */
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at 50% 30%, #1a103c 0%, #0b071e 70%, #05030a 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            perspective: 1000px;
        }

        /* 霓虹渐变文字动画 */
        h1 {
            color: #fff;
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255,215,0,0.5), 0 0 20px rgba(255,140,0,0.3);
            background: linear-gradient(45deg, #ffd700, #ff8c00, #ff4500, #ffd700);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: flowText 4s ease infinite, textPulse 2s infinite alternate;
            z-index: 10;
            user-select: none;
        }

        /* 3D 拟真精美月饼 */
        .mooncake-container {
            width: 200px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            animation: float 4s ease-in-out infinite;
            cursor: pointer;
            z-index: 10;
        }

        .mooncake {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 40%, #ffb347, #d47a16 70%, #8a4500 100%);
            border-radius: 50%;
            box-shadow: 
                inset 0 10px 20px rgba(255,255,255,0.4),
                inset 0 -10px 20px rgba(0,0,0,0.6),
                0 15px 35px rgba(0,0,0,0.5),
                0 0 30px rgba(255,165,0,0.3);
            position: relative;
            border: 6px dashed #bd6408;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s;
        }

        .mooncake:active {
            transform: scale(0.90);
        }

        /* 月饼内部传统花纹 */
        .mooncake-pattern {
            width: 75%;
            height: 75%;
            border: 4px double #ffe4b5;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffe4b5;
            font-weight: bold;
            font-size: 1.8rem;
            text-shadow: 1px 2px 2px rgba(0,0,0,0.6);
            background: repeating-radial-gradient(circle, transparent, transparent 10px, rgba(189,100,8,0.3) 10px, rgba(189,100,8,0.3) 12px);
        }

        /* 提示点击的动效文字 */
        .tip {
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
            margin-top: 30px;
            letter-spacing: 2px;
            animation: blink 1.5s infinite;
            z-index: 10;
        }

        /* 背景孔明灯灯笼 */
        .lantern {
            position: absolute;
            width: 15px;
            height: 22px;
            background: radial-gradient(circle at 50% 30%, #ff8c00, #ff4500);
            border-radius: 4px 4px 2px 2px;
            box-shadow: 0 0 15px rgba(255,69,0,0.8);
            opacity: 0.5;
            bottom: -50px;
            animation: rise linear infinite;
        }

        /* 特效画布覆盖全屏 */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* 核心动画库 */
        @keyframes flowText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes textPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
        }
        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.9; }
        }
        @keyframes rise {
            0% { transform: translateY(0) translateX(0) scale(0.6); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-105vh) translateX(var(--w)) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>中秋快乐</h1>
    
    <div class="mooncake-container" onclick="explode(event)">
        <div class="mooncake">
            <div class="mooncake-pattern">中秋</div>
        </div>
    </div>

    <div class="tip">👉 连击月饼触发中秋福气 👈</div>

    <canvas id="canvas"></canvas>

    <script>
        // 初始化画布
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const blessings = ["🥮", "🌕", "🎑", "✨", "中秋快乐", "团圆", "幸福", "阖家欢乐"];
        const MAX_PARTICLES = 180; // 【优化点 1】严格限制屏幕上同时存在的粒子最大数

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 动态生成背景孔明灯
        for(let i=0; i<20; i++) {
            let lantern = document.createElement('div');
            lantern.className = 'lantern';
            lantern.style.left = Math.random() * 100 + 'vw';
            lantern.style.animationDuration = (Math.random() * 8 + 8) + 's';
            lantern.style.animationDelay = (Math.random() * 6) + 's';
            lantern.style.setProperty('--w', (Math.random() * 100 - 50) + 'px');
            document.body.appendChild(lantern);
        }

        // 粒子类定义 (文字+新春碎星)
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.isText = Math.random() > 0.45;
                this.text = blessings[Math.floor(Math.random() * blessings.length)];
                this.radius = Math.random() * 3 + 2;
                
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 7 + 3; // 扩大速度区间，更有层次感
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                
                this.gravity = 0.15;
                this.opacity = 1;
                this.color = `hsla(${Math.random() * 45 + 35}, 100%, 60%, 1)`; 
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                if(this.isText) {
                    ctx.font = 'bold 15px sans-serif';
                    ctx.fillStyle = this.color;
                    ctx.fillText(this.text, this.x, this.y);
                } else {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffd700';
                    ctx.fill();
                }
                ctx.restore();
            }

            update() {
                this.vx *= 0.96;
                this.vy *= 0.96;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.opacity -= 0.02; // 【优化点 2】加快淡出速度，腾出内存空间
            }
        }

        // 点击月饼触发爆炸动效
        function explode(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            
            // 【优化点 3】单次生成量从 40 减到 22，高频连击更轻松
            for (let i = 0; i < 22; i++) {
                particles.push(new Particle(x, y));
            }

            // 【优化点 1 逻辑】如果累积粒子太多，强行删掉最早产生的旧粒子
            if (particles.length > MAX_PARTICLES) {
                particles.splice(0, particles.length - MAX_PARTICLES);
            }
        }

        // 动画渲染主循环
        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].opacity <= 0) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
